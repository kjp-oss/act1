    <link rel="stylesheet" href="style.css">
</head>
<body class="bod">
    <header class="head1">
        <h1>STUDENT PERSONAL FORM</h1>
    </header>
    <nav class="nav1">
        <a class="form1" href="form1 .html" >HOME</a>
        <a class="form1" href="form2.html" >STUDENT FORM</a>
        <a class="form1" href="form3.html" >GRADE TABLE</a>
        <a class="form1" href="form4.html" >MY PROFILE</a>
    </nav>
    <div class="div2">
        <section class="sec2">
            <form>
                <h1 >STUDENT FORM</h1><BR>
                First name:  <input class="input" type="text" name="first_name" />
                    <br><br>
                Last name:  <input class="input" type="text" name="last_name" />
            </form><br><br>
          
            <form>
                User ID:  <input class="input" type="text" name="user_id" />
                    <br><br>
                Password: <input class="input" type="password" name="password" />
            </form>
            <br><br>
            <form class="form">
                Description : <br><br>
                <textarea rows="10" cols="50" name="description" placeholder=" Enter description here...""></textarea>
            </form>
            
            <form>
                <H1>Favorite subject</H1>
                <input type="checkbox" name="algebra" value="on"> algebra
                <input type="checkbox" name="mmw" value="on"> mmw
                <input type="checkbox" name="pathfit" value="on"> pathfit
                <input type="checkbox" name="physics" value="on"> Physics
            </form>
            <form>
                <h1>AGE:</h1>
                <input type="radio" name="age" value="on">1-18
                <input type="radio" name="age" value="on">19-40
                <input type="radio" name="age" value="on">41-100
            </form>
            <form>
                <h1>GENDER:</h1>
                <select name="gender">
                <option value="male" selected>male</option>
                <option value="female">female</option>
                <option value="binary">binary</option>
                </select>
            </form>
            <br>
            <form>
            <input type="submit" name="submit" value="Submit" />
            <input type="reset" name="reset"  value="Reset" />
            </form>
        </section>
    </div>
